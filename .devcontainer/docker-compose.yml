# Local development only. The passwords below are throwaway values for a
# database that exists only on your own machine. Never reuse them anywhere real.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12
    volumes:
      - ..:/workspaces/vagora:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql+psycopg://vagora:vagora@db:5432/vagora
    depends_on:
      - db

  db:
    # The same major version as production (Neon, decision 0028).
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: vagora
      POSTGRES_PASSWORD: vagora
      POSTGRES_DB: vagora
    volumes:
      # Postgres 18 keeps its data under a folder per version inside this one.
      - db-data-18:/var/lib/postgresql

volumes:
  db-data-18:
