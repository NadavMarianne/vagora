version: 2
updates:
  # One pull request a week for all backend libraries, not one per library (decision 0031).
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        patterns: ["*"]
  # No npm entry for frontend/: Expo pins exact versions of its packages, and Expo Go has its
  # own built-in copies, so even small updates can break it. App packages are updated with
  # `npx expo install --fix` before each planned new APK (decision 0031). (Security alerts
  # still arrive.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
