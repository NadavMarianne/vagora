version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
  # No npm entry for frontend/: Expo pins exact versions of its packages, and Expo Go has its
  # own built-in copies, so even small updates can break it. App packages are updated with
  # `npx expo install --fix` when upgrading Expo. (Security alerts still arrive.)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
